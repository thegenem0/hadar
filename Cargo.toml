[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/thegenem0/hadar"
license = "Apache-2.0"

[workspace.dependencies]
api = { path = "crates/api", version = "0.1.0" }
crc32fast = { version = "1.5.0" }
mvcc = { path = "crates/mvcc", version = "0.1.0" }
proptest = { version = "1.5.0" }
prost = {
  version = "0.14",
  default-features = false,
  features = ["derive", "std"]
}
protox = { version = "0.9" }
redb = { version = "4" }
storage-api = { path = "crates/storage-api", version = "0.1.0" }
storage-redb = { path = "crates/storage-redb", version = "0.1.0" }
thiserror = { version = "2", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", features = ["default"] }
tonic = {
  version = "0.14",
  default-features = false,
  features = ["codegen", "router", "server"]
}
tonic-prost = { version = "0.14" }
tonic-prost-build = { version = "0.14" }
tracing = {
  version = "0.1",
  default-features = false,
  features = ["attributes", "std"]
}
wal = { path = "crates/wal", version = "0.1.0" }

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
expect_used = "warn"
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
unwrap_used = "warn"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_lifetimes = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_numeric_casts = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "warn"
unused_qualifications = "warn"
